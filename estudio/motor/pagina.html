<style>
  @font-face { font-family: Montserrat; font-weight: 900; src: url(/node_modules/@fontsource/montserrat/files/montserrat-latin-900-normal.woff2); }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  #palco, #camada { position: absolute; inset: 0; }
  #palco canvas { width: 1080px; height: 1920px; display: block; }
  .titulo {
    position: absolute; top: 150px; left: 0; right: 0; text-align: center;
    font: 900 96px/1.05 Montserrat, sans-serif; color: #fff; text-transform: uppercase;
    -webkit-text-stroke: 10px #111; paint-order: stroke fill;
    text-shadow: 0 8px 0 rgba(0,0,0,.35);
  }
  .vermelho { color: #ff3b3b; } .amarelo { color: #ffc61a; } .verde { color: #4be06b; }
  .legenda {
    position: absolute; bottom: 330px; left: 40px; right: 40px; text-align: center;
    font: 900 72px/1.1 Montserrat, sans-serif; color: #fff; text-transform: uppercase;
    -webkit-text-stroke: 9px #111; paint-order: stroke fill;
  }
  .legenda .ativa { color: #ffc61a; }
  .painel { position: absolute; left: 50%; top: 50%; font-family: Montserrat, sans-serif; font-weight: 900; }
  .tela-cheia { position: absolute; inset: 0; pointer-events: none; }
  .selo { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); padding: 10px 28px; border-radius: 40px;

  .bilhete { width: 760px; padding: 70px 60px; background: #f3ead2; color: #1b1b1b; transform-origin: center;
    font: 900 70px/1.15 Montserrat, sans-serif; text-transform: uppercase; box-shadow: 0 30px 60px rgba(0,0,0,.6); rotate: -3deg; }
  .bilhete .assinatura { margin-top: 40px; text-align: right; font-size: 60px; color: #a11; }
  .celular { width: 620px; height: 900px; border-radius: 70px; background: #0d0d12; border: 14px solid #2a2a33;
    box-shadow: 0 0 120px rgba(80,140,255,.45); padding: 120px 40px 0; box-sizing: border-box; }
  .celular .hora { color: #fff; text-align: center; font-size: 130px; }

  .celular .de { font-size: 30px; color: #8fa4ff; margin-bottom: 14px; letter-spacing: 1px; }

  .escolha { width: 940px; text-align: center; color: #fff; }
  .escolha .pergunta { font-size: 92px; line-height: 1.05; text-transform: uppercase; -webkit-text-stroke: 8px #111; paint-order: stroke fill; margin-bottom: 50px; }
  .escolha .opcao { display: flex; align-items: center; gap: 30px; text-align: left; margin: 26px 0; padding: 34px 40px;
    border-radius: 34px; font-size: 54px; line-height: 1.1; text-transform: uppercase; background: rgba(15,15,25,.85); border: 6px solid #fff; }
  .escolha .letra { flex: none; width: 110px; height: 110px; border-radius: 50%; display: grid; place-items: center; font-size: 72px; color: #111; }
  .escolha .a .letra { background: #ffc61a; } .escolha .b .letra { background: #4be06b; }
  .escolha .rodape { margin-top: 50px; font-size: 48px; color: #ffc61a; text-transform: uppercase; }

  .calendario .grade { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; padding: 30px; }
  .calendario .dia { position: relative; height: 96px; display: grid; place-items: center; font-size: 42px; color: #555; }
